name: BDS Backup

on:
  schedule:
    # 日本時間 04:17
    - cron: '17 19 * * *'

    # 日本時間 13:17
    - cron: '17 4 * * *'

  # GitHub Actionsから手動実行可能
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. バックアップ前の告知・カウントダウン
      # ============================================================
      - name: Announce and Countdown via Pterodactyl Console API
        run: |
          PANEL_URL=$(echo "${{ secrets.PANEL_URL }}" | sed 's/*$//')

          send_cmd() {
            curl -sS -f -X POST \
              "${PANEL_URL}/api/client/servers/${{ secrets.SERVER_ID }}/command" \
              -H "Authorization: Bearer ${{ secrets.API_KEY }}" \
              -H "Content-Type: application/json" \
              -H "Accept: Application/vnd.pterodactyl.v1+json" \
              -d "{\"command\": \"$1\"}"
          }

          send_cmd "say Backup: 1分後にワールドバックアップを開始します。間もなく再起動します。"
          sleep 30

          send_cmd "say Backup: 30秒後にバックアップを行います。"
          sleep 20

          send_cmd "say Backup: 10秒前！"
          sleep 5

          send_cmd "say Backup: 5..."
          sleep 1

          send_cmd "say Backup: 4..."
          sleep 1

          send_cmd "say Backup: 3..."
          sleep 1

          send_cmd "say Backup: 2..."
          sleep 1

          send_cmd "say Backup: 1..."
          sleep 1

          send_cmd "say Backup: サーバーを一時停止してバックアップを作成します..."
          sleep 2


      # ============================================================
      # 2. BDS停止
      # ============================================================
      - name: Stop BDS Server via Pterodactyl API
        run: |
          PANEL_URL=$(echo "${{ secrets.PANEL_URL }}" | sed 's/*$//')

          echo "Stopping BDS server..."

          curl -sS -f -X POST \
            "${PANEL_URL}/api/client/servers/${{ secrets.SERVER_ID }}/power" \
            -H "Authorization: Bearer ${{ secrets.API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" \
            -d '{"signal": "stop"}'

          echo "Waiting for BDS to stop..."
          sleep 30


      # ============================================================
      # 3. ワールドをtar.gzとしてバックアップ
      #
      # 対象:
      #   /home/container/worlds/world
      #
      # 保存先:
      #   /home/container/worlds/
      #
      # ファイル名:
      #   worlds_backup_YYYYMMDD_HH_MM_JST.tar.gz
      # ============================================================
      - name: Create World Backup via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT }}

          script: |
            set -ex

            echo "========================================"
            echo "BDS WORLD BACKUP START"
            echo "========================================"

            echo ""
            echo "=== Current user ==="
            whoami

            echo ""
            echo "=== Hostname ==="
            hostname

            echo ""
            echo "=== Current directory ==="
            pwd

            echo ""
            echo "=== Checking /home/container ==="
            ls -la /home/container

            echo ""
            echo "=== Checking /home/container/worlds ==="
            ls -la /home/container/worlds

            echo ""
            echo "=== Checking world directory ==="
            ls -la /home/container/worlds/world

            echo ""
            echo "=== Disk usage ==="
            df -h

            echo ""
            echo "=== Creating filename ==="

            FILENAME=$(TZ=Asia/Tokyo date '+worlds_backup_%Y%m%d_H%H_M%M_JST.tar.gz')

            echo "Filename: $FILENAME"

            echo ""
            echo "=== Changing directory ==="

            cd /home/container/worlds

            echo ""
            echo "=== Creating archive ==="

            tar -czf "$FILENAME" world

            echo ""
            echo "=== Backup created ==="

            ls -lh "$FILENAME"

            echo ""
            echo "=== Verifying archive ==="

            tar -tzf "$FILENAME" > /dev/null

            echo "Archive verification successful."

            echo ""
            echo "========================================"
            echo "BDS WORLD BACKUP SUCCESS"
            echo "========================================"


      # ============================================================
      # 4. BDS再起動
      #
      # バックアップが成功しても失敗しても必ず実行する
      # ============================================================
      - name: Start BDS Server via Pterodactyl API
        if: always()
        run: |
          PANEL_URL=$(echo "${{ secrets.PANEL_URL }}" | sed 's/*$//')

          echo "Starting BDS server..."

          curl -sS -f -X POST \
            "${PANEL_URL}/api/client/servers/${{ secrets.SERVER_ID }}/power" \
            -H "Authorization: Bearer ${{ secrets.API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" \
            -d '{"signal": "start"}'

          echo "BDS start command sent."


      # ============================================================
      # 5. Discord 成功通知
      # ============================================================
      - name: Notify Discord on Success
        if: success()
        run: |
          curl -sS -f \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "flags": 4096,
              "embeds": [{
                "title": "✅ ワールドバックアップ成功",
                "description": "カウントダウン後にBDSのワールドバックアップが正常完了し、サーバーを再起動しました。",
                "color": 3066993,
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK }}"


      # ============================================================
      # 6. Discord 失敗通知
      # ============================================================
      - name: Notify Discord on Failure
        if: failure()
        run: |
          curl -sS -f \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "flags": 4096,
              "embeds": [{
                "title": "🚨 ワールドバックアップ失敗",
                "description": "バックアップ処理中にエラーが発生しました。ログとサーバーの状態を確認してください。",
                "color": 15158332,
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK }}"
```
