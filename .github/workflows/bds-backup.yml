name: BDS World Auto Backup

on:
  schedule:
    - cron: '17 19 * * *'
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-22.04

    steps:
      - name: Announce and Countdown via Pterodactyl Console API
        run: |
          PANEL_URL=$(echo "${{ secrets.PANEL_URL }}" | sed 's/*$//')

          send_cmd() {
            curl -sS -f -X POST "${PANEL_URL}/api/client/servers/${{ secrets.SERVER_ID }}/command" \
              -H "Authorization: Bearer ${{ secrets.API_KEY }}" \
              -H "Content-Type: application/json" \
              -H "Accept: Application/vnd.pterodactyl.v1+json" \
              -d "{\"command\": \"$1\"}"
          }

          # 日本語メッセージのみに統一
          send_cmd "say Backup: 1分後にワールドバックアップを開始します。間もなく再起動します。"
          sleep 30

          send_cmd "say Backup: 30秒後にバックアップを行います。"
          sleep 20

          send_cmd "say Backup: 10秒前！"
          sleep 5

          send_cmd "say Backup: 5..."
          sleep 1
          send_cmd "say Backup: 4..."
          sleep 1
          send_cmd "say Backup: 3..."
          sleep 1
          send_cmd "say Backup: 2..."
          sleep 1
          send_cmd "say Backup: 1..."
          sleep 1

          send_cmd "say Backup: サーバーを一時停止してバックアップを作成します..."
          sleep 2

      - name: Stop BDS Server via Pterodactyl API
        run: |
          PANEL_URL=$(echo "${{ secrets.PANEL_URL }}" | sed 's/*$//')
          curl -sS -f -X POST "${PANEL_URL}/api/client/servers/${{ secrets.SERVER_ID }}/power" \
            -H "Authorization: Bearer ${{ secrets.API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" \
            -d '{"signal": "stop"}'
          
          sleep 30

      - name: Create Backup Archive via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            FILENAME=$(TZ=Asia/Tokyo date '+worlds_backup_%Y%m%d_%H%M_JST.tar.gz')
            cd /home/container/worlds
            tar -czf "$FILENAME" world
            echo "Backup created: /home/container/worlds/$FILENAME"

      # バックアップが失敗してもサーバー自体は絶対に再起動させたいので always() は残すけど、
      # 順序としてはバックアップがコケた瞬間ここに飛んで起動処理をする流れになるよ！
      - name: Start BDS Server via Pterodactyl API
        if: always()
        run: |
          PANEL_URL=$(echo "${{ secrets.PANEL_URL }}" | sed 's/*$//')
          curl -sS -f -X POST "${PANEL_URL}/api/client/servers/${{ secrets.SERVER_ID }}/power" \
            -H "Authorization: Bearer ${{ secrets.API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" \
            -d '{"signal": "start"}'

      - name: Notify Discord on Success
        if: success()
        run: |
          curl -sS -f -H "Content-Type: application/json" \
            -X POST \
            -d '{
                  "flags": 4096,
                  "embeds": [{
                    "title": "✅ ワールドバックアップ成功",
                    "description": "カウントダウン後にBDSのワールドバックアップが正常完了し、サーバーを再起動しました。",
                    "color": 3066993,
                    "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
                  }]
                }' \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Notify Discord on Failure
        if: failure()
        run: |
          curl -sS -f -H "Content-Type: application/json" \
            -X POST \
            -d '{
                  "embeds": [{
                    "title": "🚨 ワールドバックアップ失敗",
                    "description": "バックアップ処理中にエラーが発生しました。ログとサーバーの状態を確認してください。",
                    "color": 15158332,
                    "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
                  }]
                }' \
            "${{ secrets.DISCORD_WEBHOOK }}"
